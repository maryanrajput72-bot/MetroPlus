<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1C4" />
      <stop offset="35%" stop-color="#E5C06E" />
      <stop offset="70%" stop-color="#C9A24A" />
      <stop offset="100%" stop-color="#8A6A1F" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A24A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C9A24A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal / Diamond Shield -->
  <polygon points="60,6 108,30 108,90 60,114 12,90 12,30" 
           stroke="url(#goldGrad)" stroke-width="2.5" fill="#120F0B" filter="url(#glow)"/>
  
  <polygon points="60,14 100,34 100,86 60,106 20,86 20,34" 
           stroke="rgba(201, 162, 74, 0.25)" stroke-width="1.2" fill="none"/>

  <!-- Royal Crown Motif on Top -->
  <path d="M42 42 L51 49 L60 38 L69 49 L78 42 L74 58 L46 58 Z" fill="url(#goldGrad)"/>
  <circle cx="42" cy="40" r="2" fill="#FFF1C4"/>
  <circle cx="60" cy="36" r="2.5" fill="#FFF1C4"/>
  <circle cx="78" cy="40" r="2" fill="#FFF1C4"/>

  <!-- Bold "M" Letterform -->
  <path d="M38 82 L38 62 L48 74 L60 62 L72 74 L82 62 L82 82" 
        stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Plus (+) symbol in upper right -->
  <path d="M84 46 L94 46 M89 41 L89 51" 
        stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>
